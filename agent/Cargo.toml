[package]
name = "omni-me-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "omni-me-agent"
path = "src/main.rs"

[dependencies]
omni-me-core = { path = "../core", features = ["embeddings"] }
# `--bench-extraction` compares money against the parser's labels, and the
# comparison has to be exact — the same reason core uses it rather than f64.
rust_decimal = { version = "1", default-features = false }
serde_json = { workspace = true }
# A runtime dependency rather than a dev one: `--bench-retrieval` builds its
# fixture corpus in a scratch database, and that is a binary path, not a test.
tempfile = "3"
tokio = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
