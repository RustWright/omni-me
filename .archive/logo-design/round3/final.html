<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#0d0d0d;color:#dcddde;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{padding:26px 34px 44px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:#a3a3a3;font-size:12.5px;margin:0 0 8px;max-width:820px;line-height:1.5}
  .head{display:flex;gap:26px;color:#7a7a7a;font-size:10px;text-transform:uppercase;letter-spacing:.07em;padding:16px 0 8px 150px;border-bottom:1px solid #222}
  .row{display:flex;align-items:center;gap:26px;padding:22px 0;border-bottom:1px solid #1a1a1a}
  .nm{width:124px}
  .nm .t{font-size:14px;font-weight:600;color:#fff}
  .nm .d{font-size:11px;color:#8a8a8a;margin-top:2px}
  .sep{width:1px;align-self:stretch;background:#242424}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .cap{font-size:9px;color:#5a5a5a}
  .tile{border:1px solid #2a2a2a;border-radius:20px}
  .tile.sm{border-radius:6px}
  .tile.xs{border-radius:5px}
  .cc{display:inline-block;border-radius:50%;overflow:hidden;line-height:0;border:1px solid #2a2a2a}
</style></head>
<body><div class="wrap">
  <h1>omni-me — enso weight refinement</h1>
  <p class="sub">Fattened thin end + rounded brush terminals + tighter gap. Pick the boldness by how it holds at <b>32px / 24px / crop</b> (the sizes it was failing). Left group = app icon; right = <b>om</b> wordmark.</p>
  <div class="head">
    <div style="width:150px">icon</div><div style="width:34px">32</div><div style="width:24px">24</div><div style="width:64px">crop</div>
    <div style="padding-left:24px">om lockup</div><div>om 32</div>
  </div>
  <div id="sheet"></div>
</div>
<script>
const V="?v=5";
const rows=[
  ["a-light","Light","most taper"],
  ["b-medium","Medium","balanced"],
  ["c-bold","Bold","least taper"],
];
document.getElementById("sheet").innerHTML=rows.map(([k,t,d])=>`
 <div class="row">
   <div class="nm"><div class="t">${t}</div><div class="d">${d}</div></div>
   <div class="cell"><img class="tile" src="icon-enso-${k}.svg${V}" width="130" height="130"><div class="cap">icon</div></div>
   <div class="cell"><img class="tile sm" src="icon-enso-${k}.svg${V}" width="32" height="32"><div class="cap">32px</div></div>
   <div class="cell"><img class="tile xs" src="icon-enso-${k}.svg${V}" width="24" height="24"><div class="cap">24px</div></div>
   <div class="cell"><span class="cc"><img src="icon-enso-${k}.svg${V}" width="64" height="64"></span><div class="cap">crop</div></div>
   <div class="sep"></div>
   <div class="cell"><img class="tile" src="om-enso-${k}.svg${V}" width="150" height="150"><div class="cap">lockup</div></div>
   <div class="cell"><img class="tile sm" src="om-enso-${k}.svg${V}" width="36" height="36"><div class="cap">32px</div></div>
 </div>`).join("");
</script>
</body></html>
