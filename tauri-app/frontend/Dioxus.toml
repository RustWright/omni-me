[application]
name = "omni-me-frontend"
asset_dir = "assets"
tailwind_input = "input.css"
tailwind_output = "assets/tailwind.css"

[web.app]
title = "Omni-Me"

[web.watcher]
watch_path = ["src", "assets"]
reload_html = true

# No [web.resource] style here: `main.rs` loads the stylesheet with `asset!`, under
# a hashed name. A `style = ["tailwind.css"]` linked a path no build produces and
# 404'd on every launch.