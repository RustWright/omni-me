[package]
name = "frontend"
version = "1.0.2"
edition = "2024"
# Literal, not `license.workspace`: this crate is its own workspace (see the
# `[workspace]` table below) and cannot inherit from the repo root.
license = "MIT OR Apache-2.0"

[features]
default = []
mock = []

[dependencies]
dioxus = { version = "=0.7.2", features = ["web"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlElement",
    "Element",
    "Node",
    "console",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "EventTarget",
    "Event",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
chrono-tz = "0.10"
# mpsc channel + StreamExt: bridges the JS `sync:applied` event callback (which
# fires outside any Dioxus scope) into the reactive runtime — see sync_refresh.rs.
futures = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1

# Declare as standalone workspace so cargo doesn't try to join
# the parent workspace (frontend is built separately by `dx build`)
[workspace]
