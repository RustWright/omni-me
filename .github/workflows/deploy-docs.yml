name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build documentation
        run: mdbook build docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  # Publishing is gated so the build above stays useful on its own — it catches a broken
  # SUMMARY.md link or malformed markdown on every docs change, which is the point while the
  # book is still being written.
  #
  # ⚠️ Do not drop this `if` without first enabling Pages on the repo (Settings → Pages →
  # Source: GitHub Actions). deploy-pages 404s on a repo that has never had Pages enabled, and
  # it fails at the deploy step *after* a green build, which reads like a broken build.
  # To publish: enable Pages, then set repository variable PUBLISH_DOCS=true.
  deploy:
    needs: build
    if: vars.PUBLISH_DOCS == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
