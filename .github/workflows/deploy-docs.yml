name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Pinned on purpose: a rolling ubuntu-latest broke the release path once, with no
    # workflow change of ours. Raise it deliberately, never by alias.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Pinned with the plugin below: mdbook-mermaid is built against one mdBook minor
      # (0.17.1 against 0.5), so a rolling mdBook would break diagrams with no change of ours.
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.4'

      - name: Install mdbook-mermaid
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL https://github.com/badboy/mdbook-mermaid/releases/download/v0.17.1/mdbook-mermaid-v0.17.1-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Build documentation
        run: mdbook build docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  # Publishing is gated so the build above stays useful on its own — it catches a broken
  # SUMMARY.md link or malformed markdown on every docs change, which is the point while the
  # book is still being written.
  #
  # ⚠️ Do not drop this `if` without first enabling Pages on the repo (Settings → Pages →
  # Source: GitHub Actions). deploy-pages 404s on a repo that has never had Pages enabled, and
  # it fails at the deploy step *after* a green build, which reads like a broken build.
  # To publish: enable Pages, then set repository variable PUBLISH_DOCS=true.
  deploy:
    needs: build
    if: vars.PUBLISH_DOCS == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
