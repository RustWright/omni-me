name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.ico'
      - '**/*.icns'
      - '**/*.svg'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.ico'
      - '**/*.icns'
      - '**/*.svg'
      - 'LICENSE'
      - '.gitignore'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Ungated on purpose. Every other job here is behind a paths-filter because it
  # compiles something; this one only runs rustfmt, so it costs a toolchain
  # install and a few seconds, and there is no path filter that means "any Rust
  # file" without duplicating all three filters below.
  #
  # This step could not exist until 2026-08-28. The tree had drifted ~400 hunks
  # from rustfmt 1.9.0 (2026-05-25) — toolchain drift rather than neglect, since
  # the hunks were normal formatting a newer rustfmt lays out differently — and
  # landing that reformat mid-review would have made every review diff
  # unreadable. It went in as one standalone commit once the pre-v1 review
  # closed, which is what unblocked this check.
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting (core + server + app)
        run: cargo fmt --all -- --check

      # Same seam as the clippy/test jobs below: `tauri-app/frontend` is
      # `exclude`d from the root workspace and declares its own bare
      # `[workspace]`, so `--all` above cannot reach it. It needs its own
      # invocation from its own directory, permanently.
      - name: Check formatting (frontend)
        working-directory: tauri-app/frontend
        run: cargo fmt --all -- --check

  # Compute which areas actually changed (robust git-diff, not substring matching)
  # so the expensive build jobs only run when their sources moved.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so push-event diffs resolve reliably
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'core/**'
              - 'server/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            app:
              - 'core/**'
              - 'tauri-app/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            frontend:
              - 'tauri-app/frontend/**'
              - '.github/workflows/ci.yml'

  build-and-test:
    name: Build & Test (core + server)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Naming both packages in ONE invocation is load-bearing, not cosmetic.
      # `server` depends on `core` with `features = ["auto-import"]`, and cargo
      # unifies features across a single invocation — so core is compiled WITH
      # auto-import here and its ~97 IMAP / receipts / subprocess / CSV tests
      # run. Split these into two commands and core silently drops to its
      # default feature set (513 tests instead of 609) with no failure to notice.
      - name: Clippy
        run: cargo clippy -p omni-me-core -p omni-me-server --all-targets -- -D warnings

      - name: Run tests
        run: cargo test -p omni-me-core -p omni-me-server

      - name: Build release
        run: cargo build --release -p omni-me-core -p omni-me-server

  build-and-test-app:
    name: Build & Test (Tauri app)
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # `omni-me-app` pulls webkit2gtk-sys / soup3-sys / gtk-sys /
      # javascriptcore-rs-sys, which are pkg-config shims over system libraries.
      # Without these the crate cannot compile at all — which is why it sat
      # outside CI, leaving ~5,300 lines of command handlers unbuilt. It gets its
      # own job rather than joining the backend one so core/server changes don't
      # pay this apt cost, and so the two run in parallel.
      #
      # This list is deliberately shorter than the stock Tauri Linux
      # prerequisites, and is derived rather than copied: the `-sys` crates in
      # this tree declare exactly five pkg-config modules in their
      # `package.metadata.system-deps` — webkit2gtk-4.1, javascriptcoregtk-4.1,
      # libsoup-3.0 (all three satisfied by libwebkit2gtk-4.1-dev's own
      # Depends), plus gtk+-3.0 and gdk-3.0 (libgtk-3-dev). The usual extras do
      # not apply here: no appindicator (tauri is built with `features = []`, so
      # no tray), no librsvg (bundling only — CI never bundles), and neither
      # libxdo nor libssl, which `cargo tree -p omni-me-app -i` shows are absent
      # from this crate's graph (reqwest is on rustls; openssl-sys enters the
      # lockfile only through the server's auto-import native-tls path).
      # Re-derive with that same `cargo tree -i` before adding to this list.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -p omni-me-app --all-targets -- -D warnings

      - name: Run tests
        run: cargo test -p omni-me-app

      # `check --release`, not `build --release`. The defect class worth catching
      # is cfg drift — code behind `cfg(debug_assertions)` that only the release
      # profile compiles (a debug/release branch in `editor.rs` shipped a broken
      # release build once). `check` evaluates those cfgs, and skips the LTO +
      # codegen-units=1 link that the release profile would otherwise spend
      # several minutes on. The shippable artifacts are produced by
      # `tauri-app/scripts/{desktop,android}-build.sh`, not by CI.
      - name: Check release profile
        run: cargo check --release -p omni-me-app

  build-frontend:
    name: Build & Test (Frontend)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/frontend
          cache-bin: false

      # `tauri-app/frontend` is `exclude`d from the root workspace AND declares
      # its own bare `[workspace]` table, so no `--workspace` or `-p` flag from
      # the repo root can ever reach it. Every frontend step must run from its
      # own directory; that is permanent, not a temporary shortcut.
      #
      # These are plain host-native `#[test]`s (zero `wasm_bindgen_test`), so
      # they need no browser and no wasm target and finish in well under a
      # second. Browser-level interaction is verified through the Playwright MCP
      # loop in UI_WORKFLOW.md, which is interactive and not a CI candidate.
      - name: Run tests
        working-directory: tauri-app/frontend
        run: cargo test

      # Both feature configs: `mock` swaps the whole Tauri IPC bridge for stubs,
      # so each config compiles a different half of `bridge.rs` and a lint clean
      # in one says nothing about the other.
      - name: Clippy (mock)
        working-directory: tauri-app/frontend
        run: cargo clippy --target wasm32-unknown-unknown --features mock -- -D warnings

      - name: Clippy (non-mock)
        working-directory: tauri-app/frontend
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Install dioxus-cli
        uses: cargo-bins/cargo-binstall@main
      - name: Binstall dx
        run: cargo binstall dioxus-cli --no-confirm --force

      - name: Build frontend
        working-directory: tauri-app/frontend
        run: dx build --platform web --release
