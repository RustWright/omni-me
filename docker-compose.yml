# Canonical local runtime composition for the public, bank-free omni-me-server
# (Phase 2 task 2.1). `sudo docker compose up -d` builds the image from
# server/Dockerfile and runs it with a persistent named volume + a read-only
# credentials mount.
#
# Production (the deploy-pipeline session) reuses this exact shape but: binds the
# port to the tailnet interface only (nothing public), points `image:` at the
# GHCR tag instead of building locally, and runs the PRIVATE overlay binary.

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: omni-me-server:dev
    container_name: omni-me-server
    restart: unless-stopped

    # Local test exposes the port on the host. In production this becomes
    # "<tailnet-ip>:3000:3000" so the server is reachable only over Tailscale.
    ports:
      - "3000:3000"

    # Optional RUST_LOG comes from .env if present. LLM credentials are NOT
    # read from the environment — they live in credentials.toml on the volume,
    # so a key cannot leak into `docker inspect` or a spawned helper's env. The
    # server boots fine with none of this set — zero-config is a guarantee — so
    # the file is optional (long-form `required: false`).
    env_file:
      - path: .env
        required: false

    volumes:
      # One named volume holds everything stateful: the embedded SurrealDB
      # (/data/surreal_data) and uploaded blobs (/data/blobs). WORKDIR is /data,
      # so the DB's relative path lands here automatically and survives restarts.
      - omni_data:/data
      # Read-only credentials secret. Copy secrets/credentials.toml.example to
      # secrets/credentials.toml first — the file must exist before `up` (Docker
      # would otherwise create a directory at this path). The container reads it
      # as uid 10001; see DEPLOY.md for the production chown/chmod that keeps it
      # 0600 yet container-readable.
      - ./secrets/credentials.toml:/config/omni-me/credentials.toml:ro

    # Mirrors the Dockerfile HEALTHCHECK so `docker compose ps` shows health and
    # the deploy pipeline can gate on it.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # The server traps SIGTERM and flushes the embedded DB on shutdown; give it
    # room before Docker escalates to SIGKILL.
    stop_grace_period: 30s

  # The resident assistant. A peer of the server rather than a sidecar: it reaches
  # it over the same sync API a phone uses, which is why it holds its own database
  # instead of sharing one (surrealkv takes an exclusive lock on its directory, so
  # sharing is not merely undesirable — it is impossible).
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: omni-me-agent:dev
    container_name: omni-me-agent
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

    env_file:
      - path: .env
        required: false

    environment:
      # Service name, not localhost: the agent is its own container. ⛔ Required —
      # OMNI_AGENT_DATA marks the run non-production, which makes the agent ignore
      # any persisted URL rather than aim a test build at a real box.
      OMNI_AGENT_SERVER_URL: http://server:3000

    volumes:
      # ⛔ Its own volume, and not optional: it holds the vector index, whose first
      # build sweeps the corpus for over 24 minutes without answering. An ephemeral
      # data dir pays that again on every redeploy.
      - omni_agent_data:/data
      # The same read-only credentials file the server reads — the agent needs the
      # LLM section of it. Keys stay out of the environment for the same reason.
      - ./secrets/credentials.toml:/config/omni-me/credentials.toml:ro

    # Longer than the server's: a tick in flight is a model call, and cutting one
    # off loses the answer rather than delaying it.
    stop_grace_period: 60s

volumes:
  omni_data:
  omni_agent_data:
