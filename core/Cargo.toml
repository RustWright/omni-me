[package]
name = "omni-me-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Server-only: pulls in the IMAP + TLS deps and exposes the
# `auto_import` + `auto_import_scheduler` modules. Tauri clients build with
# default features off — keeps the whole stack out of the Android dep tree
# (per [[feedback-llm-server-side]] and [[project-auto-import-host]] the
# scheduler lives in `omni-me-server`, not in the client).
auto-import = [
    "dep:async-imap",
    "dep:futures-util",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:webpki-roots",
    "dep:csv",
]
# Headless-host-only: local embedding + reranking models via ONNX Runtime, for the
# assistant's semantic `search`. Same reasoning as `auto-import` — `fastembed` pulls
# `ort` and a bundled ONNX Runtime, which must never enter the Android dep tree.
# The agent enables it; Tauri and the server do not.
embeddings = ["dep:fastembed"]

[dependencies]
surrealdb = { version = "3", features = ["kv-surrealkv"] }
tokio = { workspace = true }
thiserror = "2"
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = "0.0"
ulid = { version = "1", features = ["serde"] }
chrono = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
async-trait = { workspace = true }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
rust_decimal = { version = "1", default-features = false, features = ["serde-with-str"] }
serde_with = { version = "3", default-features = false, features = ["macros", "std"] }
ledger-parser = "6"
ledger-utils = "0.6"
glob = "0.3"
base64 = "0.22"
# Downscaling before the vision call — see `extraction::media`. `default-features
# = false` keeps the codec set to the three MIME types `OpenAiCompatExtractor`
# accepts; the defaults add a dozen decoders (avif, tiff, exr…) that nothing
# routes to. All three are pure Rust, so this stays out of the openssl/native
# story that gates `auto-import` and `embeddings`.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
toml = "0.8"
tracing = "0.1"
mail-parser = "0.10"
tempfile = "3"
# ⚠️ `default-features = false` + `runtime-tokio` is load-bearing twice over: the
# defaults drag in `async-std` alongside tokio, and they pin `imap-proto 0.10`,
# which is what rust#79813 is scheduled to turn into a hard error. This spelling
# resolves to imap-proto 0.16 and no second runtime.
async-imap = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
# async-imap is TLS-agnostic — it takes an established stream — so the TLS half is
# ours to pick, and picking rustls is what keeps openssl-sys out of this tree.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
], optional = true }
# ⛔ rustls is a DIRECT dependency on purpose, and naming `ring` here is not
# redundant. This workspace compiles rustls with *both* providers — surrealdb's
# jsonwebtoken pulls `aws-lc-rs`, reqwest pulls `ring` — and under two providers
# `ClientConfig::builder()` cannot choose: it panics at connect time with "Could
# not automatically determine the process-level CryptoProvider". `imap_real.rs`
# therefore names the provider explicitly, and this line is what entitles it to.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
], optional = true }
webpki-roots = { version = "1", optional = true }
csv = { version = "1", optional = true }
# ⚠️ `default-features = false` is load-bearing. fastembed's defaults are
# `ort-download-binaries-native-tls` + `hf-hub-native-tls` + `image-models`, which
# would pull openssl-sys (this crate is rustls throughout — see `reqwest` above) and
# an image-embedding pipeline nothing here uses. The rustls variants carry the same
# capability; `image-models` has no caller.
fastembed = { version = "6", default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
], optional = true }


[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true, features = ["test-util"] }
