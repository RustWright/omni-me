[package]
name = "omni-me-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
omni-me-core = { path = "../core", features = ["auto-import"] }
axum = "0.8"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
chrono = { workspace = true }
sha2 = "0.10"
infer = "0.19"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
# ⚠️ `default-features = false` is load-bearing even in a dev-dependency. reqwest's
# defaults include `default-tls`, which is native-tls — and `cargo tree --workspace`
# unions features across members, so this one line put openssl-sys back into a tree
# `core` and `tauri-app` both spell carefully to keep it out of.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
